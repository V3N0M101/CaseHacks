<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ReturnProof | Merchant review</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/demo.css">
  <script src="/merchant.js" type="module"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row"><span class="wordmark"><span class="brand-mark" aria-hidden="true"></span>ReturnProof</span></div>
  </header>
  <main class="wrap section">
    <h1>Merchant review</h1>
    <p class="measure">Review findings from buyer submissions and record an accept or reject decision. The demo keeps findings for 30 days. A decision here is for review only and does not issue a refund.</p>
    <div class="review-actions">
      <button type="button" class="secondary" id="refresh">Refresh inspections</button>
    </div>
    <p id="review-status" role="status" aria-live="polite">Loading inspections…</p>
    <div id="inspections"></div>
    <button type="button" class="secondary" id="older" hidden>Load older inspections</button>
    <noscript>Enable JavaScript to load saved findings and record decisions.</noscript>
  </main>
</body>
</html>
