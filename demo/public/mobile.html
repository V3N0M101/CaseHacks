.dialog-backdrop { position: fixed; inset: 0; background: rgba(20, 22, 26, 0.45); display: flex; align-items: center; justify-content: center; padding: var(--space-4); z-index: 200; }
.dialog-panel { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--space-6); box-shadow: var(--shadow-dialog); display: flex; flex-direction: column; gap: var(--space-4); }

.toast-region { position: fixed; bottom: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: var(--space-2); }
.toast { background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--radius-input); font-size: var(--text-small); font-weight: 500; box-shadow: var(--shadow-dialog); }

.demo-layout { max-width: 1280px; margin: 0 auto; padding: var(--space-6) var(--space-4); display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
@media (max-width: 960px) { .demo-layout { grid-template-columns: 1fr; } }
.phone-frame { width: 100%; max-width: 376px; margin: 0 auto; background: var(--canvas); border: 8px solid var(--ink); border-radius: 28px; overflow: hidden; min-height: 640px; }
.phone-notch { height: 22px; background: var(--ink); display: flex; align-items: center; justify-content: center; color: var(--surface); font-size: 11px; font-family: var(--font-mono); }
">:root {
  /* Core color tokens (never hardcoded elsewhere) */
  --canvas: #F6F6F3;
  --surface: #FFFFFF;
  --ink: #14161A;
  --muted: #5B616B;
  --line: #E3E4DF;
  --accent: #0F5C4E;
  --accent-hover: #0B4A3F;
  --pass: #067647;
  --flag: #B45309;
  --danger: #B42318;
  --focus: #1D4ED8;

  /* Neutral evidence surfaces */
  --photo-bg: #E5E6E1;
  --surface-subtle: #FAFAF8;
  --pass-bg: #ECFDF3;
  --flag-bg: #FEF3C7;
  --danger-bg: #FEF2F2;
  --accent-bg: #EEF6F4;

  /* Typography */
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Scale */
  --text-display: 2rem;
  --lh-display: 2.5rem;
  --text-h1: 1.5rem;
  --lh-h1: 2rem;
  --text-h2: 1.125rem;
  --lh-h2: 1.625rem;
  --text-body: 0.9375rem;
  --lh-body: 1.5rem;
  --text-small: 0.8125rem;
  --lh-small: 1.25rem;

  /* Shape & spacing (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  --radius-card: 10px;
  --radius-input: 8px;
  --radius-pill: 999px;

  /* Subtle shadows (only on decision bar & dialogs) */
  --shadow-bar: 0 -4px 16px rgba(20, 22, 26, 0.06);
  --shadow-dialog: 0 12px 32px rgba(20, 22, 26, 0.14);

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 150ms;
  --dur-base: 180ms;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 8px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--focus);
  padding: 10px 16px;
  border-radius: var(--radius-input);
  z-index: 1000;
  font-weight: 600;
  text-decoration: none;
}
.skip-link:focus {
  left: 8px;
}

.t-display { font-size: var(--text-display); line-height: var(--lh-display); font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.t-h1 { font-size: var(--text-h1); line-height: var(--lh-h1); font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.t-h2 { font-size: var(--text-h2); line-height: var(--lh-h2); font-weight: 600; margin: 0; }
.t-body { font-size: var(--text-body); line-height: var(--lh-body); margin: 0; }
.t-small { font-size: var(--text-small); line-height: var(--lh-small); margin: 0; }
.t-muted { color: var(--muted); }
.t-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

@keyframes screenEnter {
  from { opacity: 0.96; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.screen-enter {
  animation: screenEnter var(--dur-base) var(--ease-out) 1 both;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 0 var(--space-4);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  font-size: 16px;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}
.mode-tabs {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.mode-tab {
  min-height: 44px;
  padding: 0 14px;
  border-radius: var(--radius-input);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: var(--text-small);
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.mode-tab:hover { color: var(--ink); background: var(--canvas); }
.mode-tab[aria-current="page"] {
  color: var(--ink);
  background: var(--canvas);
  border-color: var(--line);
}

.offline-banner {
  background: var(--flag-bg);
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-small);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-6);
}

.btn {
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-input);
  border: 1px solid transparent;
  font-family: var(--font-sans);
  font-size: var(--text-body);
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--surface); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover:not(:disabled) { background: var(--canvas); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: var(--canvas); }
.btn-destructive { background: var(--danger); color: var(--surface); }
.btn-destructive:hover:not(:disabled) { filter: brightness(0.92); }
.btn-sm { min-height: 44px; padding: 0 var(--space-3); font-size: var(--text-small); }
.btn-full { width: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: var(--text-small); font-weight: 600; color: var(--ink); }
.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: var(--radius-input);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-body);
}
.textarea { min-height: 88px; resize: vertical; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.field-help { font-size: var(--text-small); color: var(--muted); }
.field-error { font-size: var(--text-small); color: var(--danger); font-weight: 500; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  font-size: var(--text-small);
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--canvas);
  color: var(--ink);
  white-space: nowrap;
}
.badge-pass { background: var(--pass-bg); color: var(--pass); border-color: transparent; }
.badge-flag { background: var(--flag-bg); color: var(--flag); border-color: transparent; }
.badge-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.badge-human { background: var(--surface); color: var(--flag); border-color: var(--flag); }

.conf-meter { display: inline-flex; align-items: center; gap: var(--space-2); }
.conf-track { width: 56px; height: 6px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; flex-shrink: 0; }
.conf-fill { height: 100%; background: var(--accent); border-radius: var(--radius-pill); display: block; }
.conf-fill.is-flag { background: var(--flag); }
.conf-fill.is-pass { background: var(--pass); }
.conf-val { font-family: var(--font-mono); font-size: var(--text-small); color: var(--ink); font-weight: 600; }

.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--canvas);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}
.btn-primary .kbd, .btn-destructive .kbd {
  background: rgba(255,255,255,0.16);
  border-color: rgba(255,255,255,0.28);
  color: var(--surface);
}

/* Shopper flow (max-width 480px) */
.shopper-wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-10);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.shopper-step-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-small);
  color: var(--muted);
}
.guidance-card {
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-small);
  color: var(--ink);
}
.live-instruction-card {
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-radius: var(--radius-card);
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.instruction-steps {
  display: flex;
  gap: 6px;
}
.instruction-pill {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--line);
}
.instruction-pill.is-done, .instruction-pill.is-active {
  background: var(--accent);
}
.disclosure-btn {
  background: none;
  border: none;
  padding: 8px 0;
  min-height: 44px;
  color: var(--accent);
  font-family: var(--font-sans);
  font-size: var(--text-small);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-align: left;
  display: inline-flex;
  align-items: center;
}
.disclosure-panel {
  border-left: 2px solid var(--line);
  padding-left: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: var(--text-small);
  color: var(--muted);
}

.photo-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--photo-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-stage img, .photo-stage video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.framing-guide {
  position: absolute;
  inset: 16px;
  pointer-events: none;
}
.framing-guide::before, .framing-guide::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: var(--ink);
  border-style: solid;
  opacity: 0.45;
}
.framing-guide::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
.framing-guide::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.rec-pill {
  position: absolute;
  top: 10px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(20, 22, 26, 0.86);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  pointer-events: none;
}
.rec-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
  display: inline-block;
}
.video-review {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--photo-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  object-fit: contain;
}

.drop-zone {
  border: 1px dashed var(--muted);
  border-radius: var(--radius-input);
  padding: var(--space-3) var(--space-4);
  text-align: center;
  background: var(--surface-subtle);
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-small);
  font-weight: 600;
  color: var(--ink);
}
.drop-zone.is-dragover {
  border-color: var(--accent);
  background: var(--accent-bg);
}

.thumb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.thumb-box {
  background: var(--photo-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
  aspect-ratio: 1 / 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb-box img { width: 100%; height: 100%; object-fit: contain; }

.progress-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-5); padding: var(--space-4) 0; }
.progress-ring-svg { transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: var(--line); stroke-width: 6; }
.progress-ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 400ms var(--ease-out); }
.step-checklist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: var(--space-2); }
.step-checklist li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-input);
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: var(--text-small);
}
.step-checklist li.is-done { border-color: var(--pass); color: var(--ink); font-weight: 600; }
.step-checklist li.is-active { border-color: var(--accent); font-weight: 600; }

/* Merchant Dashboard (1280px + 240px left nav) */
.merchant-shell {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: calc(884px - 57px);
}
.merchant-nav {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: var(--space-4) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.nav-item {
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-input);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--canvas); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nav-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 1px 7px;
  border-radius: var(--radius-pill);
  background: var(--canvas);
  border: 1px solid var(--line);
  color: var(--ink);
}
.merchant-main { padding: var(--space-6); min-width: 0; display: flex; flex-direction: column; gap: var(--space-5); }

@media (max-width: 1023px) {
  .merchant-shell { grid-template-columns: 64px minmax(0, 1fr); }
  .nav-label, .nav-count { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .merchant-main { padding: var(--space-4); }
}
@media (max-width: 639px) {
  .merchant-shell { grid-template-columns: 1fr; }
  .merchant-nav { flex-direction: row; border-right: none; border-bottom: 1px solid var(--line); overflow-x: auto; padding: var(--space-2); }
  .nav-item { width: auto; padding: 0 12px; }
}

.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); overflow-x: auto; }
.queue-table { width: 100%; border-collapse: collapse; text-align: left; font-size: var(--text-small); }
.queue-table thead th {
  position: sticky;
  top: 0;
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--line);
  padding: 12px 12px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}
.queue-table tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
.queue-table tbody tr:last-child { border-bottom: none; }
.queue-table tbody tr:hover { background: var(--canvas); }
.queue-table td { padding: 12px 12px; vertical-align: middle; }

.evidence-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
.evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
@media (max-width: 767px) { .evidence-grid { grid-template-columns: 1fr; } }
.evidence-pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; display: flex; flex-direction: column; }
.evidence-pane-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: var(--text-small); font-weight: 600; }
.evidence-viewport { position: relative; height: 360px; background: var(--photo-bg); overflow: hidden; cursor: grab; user-select: none; }
.evidence-viewport:active { cursor: grabbing; }
.evidence-stage { position: absolute; inset: 0; transform-origin: center center; }
.evidence-stage img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.bbox-overlay { position: absolute; border: 2px solid var(--flag); background: transparent; pointer-events: none; border-radius: 4px; }
.bbox-tag { position: absolute; top: -22px; left: -2px; background: var(--ink); color: var(--surface); font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }

.evidence-toolbar, .sku-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
}
.flag-list { display: flex; flex-direction: column; gap: var(--space-2); }
.flag-row {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}
.flag-row.is-human { border-color: var(--flag); }

.decision-bar {
  position: sticky;
  bottom: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-bar);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  z-index: 20;
}
.decision-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-left: auto; }

.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of (Array.isArray(children) ? children : [children])) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}

function fmtDur(sec) {
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}

function stopLiveRecording() {
  if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; }
  if (state.recorder && state.recorder.state !== 'inactive') {
    try { state.recorder.stop(); } catch {}
  }
  state.recorder = null;
  if (state.stream) { state.stream.getTracks().forEach((t) => t.stop()); state.stream = null; }
  state.isRecording = false;
  state.cameraActive = false;
}

function createShopperEl(fast = false, onDone = null) {
  const wrap = el('div', { class: 'shopper-wrap' });

  async function startLiveSession() {
    stopLiveRecording();
    if (state.recordedVideoUrl) { URL.revokeObjectURL(state.recordedVideoUrl); state.recordedVideoUrl = null; }
    state.shopperStep = 'item';
    state.instIdx = 0;
    state.recSeconds = 0;
    state.itemPhoto = null;
    state.tagPhoto = null;
    state.tagSkipped = false;
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
        state.cameraActive = true;
        if (typeof MediaRecorder !== 'undefined') {
          state.chunks = [];
          const rec = new MediaRecorder(state.stream);
          rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) state.chunks.push(ev.data); };
          rec.onstop = () => {
            if (state.chunks.length > 0) {
              const blob = new Blob(state.chunks, { type: rec.mimeType || 'video/webm' });
              state.recordedVideoUrl = URL.createObjectURL(blob);
              renderShopper();
            }
          };
          rec.start(500);
          state.recorder = rec;
          state.isRecording = true;
        }
      } catch { state.cameraActive = false; state.isRecording = false; state.stream = null; }
    }
    state.recTimer = setInterval(() => {
      state.recSeconds += 1;
      const pill = wrap.querySelector('.rec-time');
      if (pill) pill.textContent = (state.isRecording ? 'REC' : 'LIVE') + ' · ' + fmtDur(state.recSeconds);
    }, 1000);
    renderShopper();
  }

            onChange: (e) => {
              state.selectedCatId = e.target.value;

            setTimeout(() => { state.progressPct = 55; state.progressStep = 1; renderShopper(); }, fast ? 650 : 1800);
            setTimeout(() => { state.progressPct = 85; state.progressStep = 2; renderShopper(); }, fast ? 1300 : 3600);
            setTimeout(() => {
              state.shopperStep = 'result';
              renderShopper();
              if (onDone) onDone();
            }, fast ? 2000 : 5400);
          }
        })
      ]));
      return;
    }

    if (state.shopperStep === 'processing') {
      wrap.appendChild(el('div', { class: 'card screen-enter', style: { display: 'flex', flexDirection: 'column', gap: '16px', textAlign: 'center' } }, [
        el('h1', { class: 't-h1', text: 'Checking your return' }),
        el('p', { class: 't-body', text: ['Checking the item', 'Matching your order', 'Preparing the result'][state.progressStep] || 'Preparing the result' }),
        el('p', { class: 't-small t-muted', text: 'Progress: ' + state.progressPct + '% · This usually takes about 7 seconds.' })
      ]));
      return;
    }

    wrap.appendChild(el('div', { class: 'card screen-enter', style: { display: 'flex', flexDirection: 'column', gap: '16px' } }, [
      el('span', { class: 'badge badge-flag', style: { alignSelf: 'flex-start' }, text: 'Quick team review' }),
      el('h1', { class: 't-h1', text: "Thanks. Our team is taking a quick look. You'll hear back within one business day." }),
      el('p', { class: 't-small t-muted', text: 'Your photos are used only to process this return.' })
    ]));
  }

  renderShopper();
  return {
    el: wrap,
    runDemo() {
      stopLiveRecording();
      state.shopperStep = 'welcome'; state.itemPhoto = null; state.tagPhoto = null; state.instIdx = 0; renderShopper();
      setTimeout(() => { state.shopperStep = 'item'; state.instIdx = 0; renderShopper(); }, 600);
      setTimeout(() => { state.instIdx = 1; state.itemPhoto = '../../public/assets/sweater-return.png'; renderShopper(); }, 1500);
      setTimeout(() => { state.shopperStep = 'tag'; renderShopper(); }, 2500);
      setTimeout(() => { state.tagPhoto = '../../public/assets/sweater-tag.png'; state.shopperStep = 'confirm'; renderShopper(); }, 3600);
    }
  };
}

function notifyDesktopDashboard(record) {
  try {
    if (typeof BroadcastChannel !== 'undefined') {
      const ch = new BroadcastChannel('returnproof_sync');
      ch.postMessage({ type: 'new_inspection', record });
      ch.close();
    }
  } catch {}
  try {
    fetch('/api/inspections', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(record),
    }).catch(() => {});
  } catch {}
}

function renderRoot() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el('header', { class: 'topbar' }, [
    el('span', { class: 'brand' }, [el('span', { class: 'brand-mark', text: 'RP' }), el('span', { text: 'ReturnProof' })]),
    el('span', { class: 'badge', text: 'Mobile Return AI' })
  ]));

  app.appendChild(createShopperEl(false, () => {
    notifyDesktopDashboard({
      orderNumber: 'NL-48305',
      itemName: state.customName,
      itemSku: state.customSku,
      itemSize: state.customSize,
      refundValue: state.customValue,
      itemImageKey: state.itemPhoto || '../../public/assets/sweater-return.png',
      tagImageKey: state.tagSkipped ? null : (state.tagPhoto || '../../public/assets/sweater-tag.png'),
    });
    toast('Sent to desktop Merchant dashboard');
  }).el);
}

renderRoot();

  </script>
